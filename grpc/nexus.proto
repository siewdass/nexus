syntax = "proto3";

package nexus;

message MessageRequest {
  string session_id = 1;
  string message = 2;
}

message MessageResponse {
  string session_id = 1;
  oneof payload {
    string think = 2;
    string reply = 3;
    bool done = 4;
    string error = 5;
  }
}

message SettingsFetchRequest {}

message SettingsPayload {
  bool tunnel = 1;
}

message SettingsPatchResponse {
  bool success = 1;
  string error = 2;
}

service NexusService {
  rpc Message(MessageRequest) returns (stream MessageResponse);
  rpc SettingsFetch(SettingsFetchRequest) returns (SettingsPayload);
  rpc SettingsPatch(SettingsPayload) returns (SettingsPatchResponse);
}
