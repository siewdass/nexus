name: nexus_hub
description: "Nexus Hub tray app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.0
  tray_manager: ^0.4.0
  llama_cpp_dart: ^0.9.0-dev.6
  socket_io_plus: ^2.0.0
  mcp_client: ^2.0.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  hotreloader: ^4.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/libllama.dylib
    - assets/Qwen3-0.6B-Q8_0.gguf
    - assets/cloudflared
