name: nexus_hub
description: "Nexus Hub tray app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.0
  tray_manager: ^0.4.0
  llama_cpp_dart: ^0.9.0-dev.6
  ffi: ^2.1.0
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  sembast: ^3.7.0
  uuid: ^4.0.0
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.0
  peer_rtc: ^1.1.0+1
  qr_flutter: ^4.1.0
  syncfusion_flutter_gauges: ^33.2.10
  langchain: ^0.8.0
  langchain_openai: ^0.8.0
  langchain_google: ^0.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon-light.png
    - assets/icon-dark.png
    - assets/logo.png
