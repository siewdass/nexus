name: nexus_link
description: Nexus Link
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  flutter_recorder: ^1.1.5
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.5
  flutter_background_service: ^5.0.0
  speech_to_text: ^7.4.0
  shared_preferences: ^2.3.4
  provider: ^6.1.2
  nexus_grpc:
    path: ../grpc
  audioplayers: ^6.1.0
    
flutter:
  uses-material-design: true
  assets:
    - assets/melspectrogram.tflite
    - assets/embedding.tflite
    - assets/nexus.tflite
    - assets/beep.wav